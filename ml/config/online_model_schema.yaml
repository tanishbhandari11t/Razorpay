version: 1
model_version: recovery_model_v2_online
feature_set: temporal_recovery_features_v2_online
objective: recovery_probability_by_candidate_action
prediction: P(recovery | deployable_context, candidate_action)
base_feature_schema: ml/config/feature_schema.yaml
availability_contract: ml/config/online_feature_schema.yaml
training_source: ml/data/processed/logging_policy_dataset.csv
real_shadow_training_allowed: false

features:
  - name: amount_inr
    type: numeric
    source: payment.amount
    availability: online
    derivation: payment amount in paise divided by 100
    temporal_cutoff: current_payment
  - name: hour_of_day
    type: numeric
    source: payment.created_at
    availability: online
    derivation: UTC hour
    temporal_cutoff: current_payment
  - name: is_weekend
    type: numeric
    source: payment.created_at
    availability: online
    derivation: UTC weekday is Saturday or Sunday
    temporal_cutoff: current_payment
  - name: day_of_week
    type: categorical
    source: payment.created_at
    availability: online
    derivation: UTC weekday name
    temporal_cutoff: current_payment
  - name: chosen_intervention
    type: categorical
    source: policy.candidate_action
    availability: inference
    derivation: injected once per candidate action
    temporal_cutoff: inference_only
  - name: has_prior_history
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior terminal payment count is greater than zero
    temporal_cutoff: strictly_before_prediction_time
  - name: has_previous_success
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: any prior terminal success
    temporal_cutoff: strictly_before_prediction_time
  - name: has_previous_failure
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: any prior terminal failure
    temporal_cutoff: strictly_before_prediction_time
  - name: previous_transaction_count
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: count of prior terminal payments
    temporal_cutoff: strictly_before_prediction_time
  - name: previous_success_count
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: count of prior terminal successes
    temporal_cutoff: strictly_before_prediction_time
  - name: previous_failure_count
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: count of prior terminal failures
    temporal_cutoff: strictly_before_prediction_time
  - name: historical_success_rate
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: previous_success_count divided by previous_transaction_count
    temporal_cutoff: strictly_before_prediction_time
  - name: historical_failure_rate
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: previous_failure_count divided by previous_transaction_count
    temporal_cutoff: strictly_before_prediction_time
  - name: previous_failure_streak
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: trailing count of prior consecutive failures
    temporal_cutoff: strictly_before_prediction_time
  - name: transactions_last_7d
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior terminal payment count in open seven-day window
    temporal_cutoff: strictly_before_prediction_time
  - name: successes_last_7d
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior success count in open seven-day window
    temporal_cutoff: strictly_before_prediction_time
  - name: failures_last_7d
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior failure count in open seven-day window
    temporal_cutoff: strictly_before_prediction_time
  - name: amount_last_7d
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior terminal amount sum in open seven-day window
    temporal_cutoff: strictly_before_prediction_time
  - name: transactions_last_30d
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior terminal payment count in open thirty-day window
    temporal_cutoff: strictly_before_prediction_time
  - name: successes_last_30d
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior success count in open thirty-day window
    temporal_cutoff: strictly_before_prediction_time
  - name: failures_last_30d
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior failure count in open thirty-day window
    temporal_cutoff: strictly_before_prediction_time
  - name: amount_last_30d
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: prior terminal amount sum in open thirty-day window
    temporal_cutoff: strictly_before_prediction_time
  - name: days_since_previous_transaction
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: days since latest prior terminal payment or no-history sentinel
    temporal_cutoff: strictly_before_prediction_time
  - name: days_since_previous_success
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: days since latest prior success or no-history sentinel
    temporal_cutoff: strictly_before_prediction_time
  - name: days_since_previous_failure
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: days since latest prior failure or no-history sentinel
    temporal_cutoff: strictly_before_prediction_time
  - name: previous_avg_amount
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: mean prior terminal amount
    temporal_cutoff: strictly_before_prediction_time
  - name: previous_median_amount
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: median prior terminal amount
    temporal_cutoff: strictly_before_prediction_time
  - name: previous_max_amount
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: maximum prior terminal amount
    temporal_cutoff: strictly_before_prediction_time
  - name: amount_vs_previous_avg
    type: numeric
    source: payment.amount+database.customer_history
    availability: online_derivable
    derivation: current amount divided by mean prior amount
    temporal_cutoff: strictly_before_prediction_time
  - name: current_amount_percentile
    type: numeric
    source: payment.amount+database.customer_history
    availability: online_derivable
    derivation: fraction of prior amounts not greater than current amount
    temporal_cutoff: strictly_before_prediction_time
  - name: historical_weekend_ratio
    type: numeric
    source: database.customer_history
    availability: online_derivable
    derivation: fraction of prior terminal payments on weekends
    temporal_cutoff: strictly_before_prediction_time
  - name: same_day_of_week_previous_rate
    type: numeric
    source: payment.created_at+database.customer_history
    availability: online_derivable
    derivation: fraction of prior payments on current UTC weekday
    temporal_cutoff: strictly_before_prediction_time
  - name: usual_hour_previous_rate
    type: numeric
    source: payment.created_at+database.customer_history
    availability: online_derivable
    derivation: fraction of prior payments within two circular hours
    temporal_cutoff: strictly_before_prediction_time

unsupported_features:
  remove:
    - transaction_type
    - merchant_category
    - device_type
    - network_type
    - sender_age_group
    - sender_state
    - sender_bank
    - same_transaction_type_previous_count
    - same_merchant_category_previous_count
    - same_merchant_category_previous_rate
    - customer_primary_device_before_failure
    - device_matches_primary
    - customer_primary_network_before_failure
    - network_matches_primary
    - previous_fraud_count
    - historical_fraud_rate
  replace: []
