version: "1.0"
feature_set: temporal_recovery_features_v1
prediction_entity: failed_payment

temporal_contract:
  history_predicate: transaction_timestamp < prediction_time
  same_timestamp_excluded: true
  seven_day_window: prediction_time - 7d < transaction_timestamp < prediction_time
  thirty_day_window: prediction_time - 30d < transaction_timestamp < prediction_time
  timezone: UTC

sentinels:
  no_history_recency_days: -1.0
  unavailable_category: UNKNOWN
  unavailable_numeric: 0.0

features:
  - {name: transaction_id, type: categorical, source: current_payment, lookback: current, model_input: false}
  - {name: customer_id, type: categorical, source: recovery_case, lookback: current, model_input: false}
  - {name: prediction_time, type: timestamp, source: current_payment.created_at, lookback: current, model_input: false}
  - {name: amount_inr, type: numeric, source: current_payment.amount, lookback: current, model_input: true}
  - {name: transaction_type, type: categorical, source: payment_feature_context, lookback: current, model_input: true}
  - {name: merchant_category, type: categorical, source: payment_feature_context, lookback: current, model_input: true}
  - {name: device_type, type: categorical, source: payment_feature_context, lookback: current, model_input: true}
  - {name: network_type, type: categorical, source: payment_feature_context, lookback: current, model_input: true}
  - {name: fraud_flag, type: integer, source: payment_feature_context, lookback: current, model_input: false}
  - {name: hour_of_day, type: integer, source: current_payment.created_at, lookback: current, model_input: true}
  - {name: day_of_week, type: categorical, source: current_payment.created_at, lookback: current, model_input: true}
  - {name: is_weekend, type: integer, source: current_payment.created_at, lookback: current, model_input: true}
  - {name: sender_age_group, type: categorical, source: payment_feature_context, lookback: current, model_input: true}
  - {name: sender_state, type: categorical, source: payment_feature_context, lookback: current, model_input: true}
  - {name: sender_bank, type: categorical, source: payment_feature_context, lookback: current, model_input: true}
  - {name: chosen_intervention, type: categorical, source: policy_candidate, lookback: inference, model_input: true, online_materialized: false}
  - {name: has_prior_history, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: has_previous_success, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: has_previous_failure, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: previous_transaction_count, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: previous_success_count, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: previous_failure_count, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: historical_success_rate, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: historical_failure_rate, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: previous_failure_streak, type: integer, source: customer_history, lookback: prior_transactions, model_input: true}
  - {name: transactions_last_7d, type: integer, source: customer_history, lookback: 7d, model_input: true}
  - {name: successes_last_7d, type: integer, source: customer_history, lookback: 7d, model_input: true}
  - {name: failures_last_7d, type: integer, source: customer_history, lookback: 7d, model_input: true}
  - {name: amount_last_7d, type: numeric, source: customer_history, lookback: 7d, model_input: true}
  - {name: transactions_last_30d, type: integer, source: customer_history, lookback: 30d, model_input: true}
  - {name: successes_last_30d, type: integer, source: customer_history, lookback: 30d, model_input: true}
  - {name: failures_last_30d, type: integer, source: customer_history, lookback: 30d, model_input: true}
  - {name: amount_last_30d, type: numeric, source: customer_history, lookback: 30d, model_input: true}
  - {name: days_since_previous_transaction, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: days_since_previous_success, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: days_since_previous_failure, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: previous_avg_amount, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: previous_median_amount, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: previous_max_amount, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: amount_vs_previous_avg, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: current_amount_percentile, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: same_transaction_type_previous_count, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: same_merchant_category_previous_count, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: same_merchant_category_previous_rate, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: customer_primary_device_before_failure, type: categorical, source: customer_history, lookback: all_prior, model_input: true}
  - {name: device_matches_primary, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: customer_primary_network_before_failure, type: categorical, source: customer_history, lookback: all_prior, model_input: true}
  - {name: network_matches_primary, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: previous_fraud_count, type: integer, source: customer_history, lookback: all_prior, model_input: true}
  - {name: historical_fraud_rate, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: historical_weekend_ratio, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: same_day_of_week_previous_rate, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
  - {name: usual_hour_previous_rate, type: numeric, source: customer_history, lookback: all_prior, model_input: true}
