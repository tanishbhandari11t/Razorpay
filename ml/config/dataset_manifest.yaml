dataset:
  name: logging_policy_dataset
  version: "1.0"
  path: ml/data/processed/logging_policy_dataset.csv
  sha256: ef90f8716158f5dd07becee445a33b7af1ceac4284b28129657ea475f9796abf
  rows: 12376

split:
  type: frozen_temporal_membership
  column: split
  train:
    rows: 8663
    membership_sha256: a7fcfb8a34375d5b7186e45b2422ab7cc6119243341cf26c2a779093b50ab4a5
  validation:
    rows: 1856
    starts_at: "2024-09-11T12:57:03"
    membership_sha256: c8241f4924675f7869bf7faf3272f230a847c136ba92c6856ab29048c0861899
  test:
    rows: 1857
    starts_at: "2024-11-05T22:28:08"
    membership_sha256: 70a1ac3ad1bfedab531cc2d62926aa884e1daf20fd7494904a25edfaaa1fd711

random_seed: 42

target:
  name: recovered

identifiers:
  - payment_id
  - customer_id

categorical_features:
  - transaction_type
  - merchant_category
  - device_type
  - network_type
  - day_of_week
  - sender_age_group
  - sender_state
  - sender_bank
  - customer_primary_device_before_failure
  - customer_primary_network_before_failure
  - chosen_intervention

numerical_features:
  - amount_inr
  - hour_of_day
  - is_weekend
  - has_prior_history
  - has_previous_success
  - has_previous_failure
  - previous_transaction_count
  - previous_success_count
  - previous_failure_count
  - historical_success_rate
  - historical_failure_rate
  - previous_failure_streak
  - transactions_last_7d
  - successes_last_7d
  - failures_last_7d
  - amount_last_7d
  - transactions_last_30d
  - successes_last_30d
  - failures_last_30d
  - amount_last_30d
  - days_since_previous_transaction
  - days_since_previous_success
  - days_since_previous_failure
  - previous_avg_amount
  - previous_median_amount
  - previous_max_amount
  - amount_vs_previous_avg
  - current_amount_percentile
  - same_transaction_type_previous_count
  - same_merchant_category_previous_count
  - same_merchant_category_previous_rate
  - device_matches_primary
  - network_matches_primary
  - previous_fraud_count
  - historical_fraud_rate
  - historical_weekend_ratio
  - same_day_of_week_previous_rate
  - usual_hour_previous_rate

excluded_columns:
  receiver_bank: unavailable in the frozen Phase 3 feature table
  receiver_age_group: unavailable in the frozen Phase 3 feature table
  prediction_time: temporal audit metadata
  split: frozen partition metadata
  fraud_flag: hard policy constraint, not a recovery feature
  base_policy_intervention: logging-policy metadata
  policy_probability: propensity used for evaluation, not prediction
  policy_type: logging-policy metadata
  logging_policy_version: logging-policy metadata
  amount_recovered: post-treatment outcome
  intervention_cost: post-treatment accounting
  net_recovered: post-treatment outcome
  time_to_recovery_hours: post-treatment outcome

forbidden_patterns:
  - simulated_recovery_probability
  - counterfactual
  - retry_outcome
  - payment_link_outcome
  - whatsapp_outcome
  - escalation_outcome
